<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-2">

  @for (product of productResource.value()?.products; track product.id) {
    <product-card [product]="product"></product-card>
  }@empty {
    <h2 class="text-2xl text-accent">No hay productos</h2>
  }
</div>
<pagination [pages]="productResource.value()?.pages ?? 0" [currentPage]="pagination.currentPage()" ></pagination>
