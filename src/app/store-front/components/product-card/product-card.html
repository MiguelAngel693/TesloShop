<div class="card bg-base-100 shadow-sm animate-fadeIn">
  <figure>
    <img [src]="product().images | image" alt="Shoes" />
  </figure>
  <div class="card-body">
    <h2 class="card-title">
      {{ product().title}}
      <div class="badge badge-secondary">NEW</div>
    </h2>
    <p> {{product().description}}</p>
    <!-- <p>A card component has a figure, a body part, and inside body there are title and actions parts</p> -->
    <div class="card-actions justify-start">
      @for (tag of product().tags; track $index) {

      <div class="badge badge-outline"> {{tag}}
      </div>
      }
      <!-- <div class="badge badge-outline">Products</div>
      <div class="badge badge-outline"> {{product().tags}}</div> -->
    </div>
    <div class="card-actions justify-end">
      <a class="link link-accent" [routerLink]="['/product',product().slug]">Mas</a>
    </div>

  </div>
</div>
