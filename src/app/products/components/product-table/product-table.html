<div class="overflow-x-auto">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>
          <label>
            <input type="checkbox" class="checkbox" />
          </label>
        </th>
        <th>Titulo</th>
        <th>Precio</th>
        <th>Stock</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <!-- row 1 -->
      @for (product of products(); track $index) {

      <tr>
        <th>
          <label>
            {{($index+1)}}
          </label>
        </th>
        <td>
          <div class="flex items-center gap-3">
            <div class="avatar">
              <div class="mask mask-squircle h-12 w-12">
                <img [src]="product.images | image" [alt]="product.title" />
              </div>
            </div>
            <div>
              <div class="font-bold cursor-pointer hover:text-primary transition-colors duration-200" routerLink="/admin/product/{{product.id}}">{{ product.title }}</div>
              <a class="text-sm opacity-50">{{ product.sizes.join(', ')}}</a>
            </div>
          </div>
        </td>
        <td>
          {{ product.price | currency }}
        </td>
        <td>
          <!--  -->
          @if (product.stock <= 10) { <!-- -->
            <!--  -->
            <span class="badge-error badge"> {{product.stock}} </span>
            <!--  -->
            }
            <!--  -->
            @else if (product.stock <= 20) { <!-- -->
              <!--  -->
              <span class="badge badge-warning"> {{product.stock}} </span>
            }
              <!--  -->
            @else {
              <!--  -->
              <span class="badge badge-success"> {{product.stock}} </span>
              <!--  -->
            }
        </td>
        <th>
          <a routerLink="/admin/product/{{product.id}}" class="btn btn-primary"> Detalles </a>
        </th>
      </tr>
      }
    </tbody>
  </table>
</div>
