<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>

<form [formGroup]="productForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4" (ngSubmit)="onSubmit()">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Datos generales</h2>
    <!-- ! Titulo -->
    <input formControlName="title" type="text" placeholder="Título" class="input input-bordered w-full"
      [class.border-red-500]="productForm.get('title')?.errors ?? false" />
    <form-label-error [control]="productForm.controls.title" />
    <!-- ! Slug -->
    <input formControlName="slug" type="text" placeholder="Slug" class="input input-bordered w-full"[class.border-red-500]="productForm.get('slug')?.errors ?? false" />
    <form-label-error [control]="productForm.controls.slug" />

    <!-- ! Descripcion -->
    <textarea formControlName="description" class="textarea textarea-bordered" placeholder="Descripción"
      rows="6" [class.border-red-500]="productForm.get('description')?.errors ?? false"></textarea>
    <form-label-error [control]="productForm.get('description')!" />

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <!-- ! Precio -->
      <div>
        <input formControlName="price" type="number" placeholder="Precio" class="input input-bordered w-full" />
        <form-label-error [control]="productForm.get('price')!" [class.border-red-500]="productForm.get('price')?.errors ?? false" />

      </div>
      <!-- ! Stock -->
      <div>
        <input formControlName="stock" type="number" placeholder="Inventario"[class.border-red-500]="productForm.get('stock')?.errors ?? false" class="input input-bordered w-full" />
        <form-label-error [control]="productForm.get('stock')!"/>

      </div>
    </div>

    <!--! tags -->
    <input formControlName="tags" type="text" placeholder="Tags" class="input input-bordered w-full" />
    <form-label-error [control]="productForm.get('tags')!" />

    <!--! Botones para el género -->
    <div class="grid grid-cols-3 gap-2">
      <button type="button" class="btn btn-sm" [class.btn-primary]="productForm.value.gender==='men'"
        (click)="productForm.patchValue({gender:'men'})">Masculino</button>
      <button type="button" class="btn btn-sm " [class.btn-warning]="productForm.value.gender==='kid'"
        (click)="productForm.patchValue({gender:'kid'})">Niños</button>
      <button type="button" class="btn btn-sm" [class.btn-accent]="productForm.value.gender==='women'"
        (click)="productForm.patchValue({gender:'women'})">Femenino</button>
      <button type="button" class="btn btn-sm" [class.btn-secondary]="productForm.value.gender==='unisex'"
        (click)="productForm.patchValue({gender:'unisex'})">Unisex</button>
    </div>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!--! Sizes -->
    <div class="grid grid-cols-6 gap-2">
      @for (size of sizes; track size) {
      <button type="button" class="btn btn-sm" [class.btn-secondary]="productForm.value.sizes?.includes(size)"
        (click)="onSizeChange(size)">{{ size }}</button>
      }
    </div>
  </div>

  <!--! Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>

    <product-carousel [images]="product().images" />

    <input type="file" class="file-input file-input-bordered w-full mt-4" />
  </div>
</form>
